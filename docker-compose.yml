version: "3.8"

services:
  web:
    build: .
    container_name: dish-image-generator
    ports:
      - "${PORT:-8765}:8765"
    environment:
      - PORT=8765
      - HOST=0.0.0.0
    env_file:
      - .env
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ppio-image-api
    ports:
      - "${API_PORT:-8766}:8766"
    environment:
      - API_PORT=8766
      - API_HOST=0.0.0.0
    env_file:
      - .env
    restart: unless-stopped
